# Alinino RAG — PRODUCTION (Oracle Cloud Always Free, ARM64)
# İşə salma:  docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d
#
# Təhlükəsizlik prinsipi:
#   • Yalnız Caddy (80/443) internetə açıqdır → HTTPS + reverse proxy.
#   • n8n heç bir portu birbaşa açmır (yalnız Caddy vasitəsilə).
#   • Postgres/Qdrant yalnız 127.0.0.1-ə bağlıdır (host skriptləri üçün, internetə YOX).
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: alinino
    ports:
      - "127.0.0.1:5432:5432"   # yalnız lokal host (scraper/sync üçün)
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d alinino"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"   # yalnız lokal host (sync.py silmə üçün)
    volumes:
      - qdrant_data:/qdrant/storage

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    # PORT AÇILMIR — yalnız Caddy şəbəkə daxilində n8n:5678-ə çıxır
    environment:
      N8N_HOST: ${DOMAIN}
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      WEBHOOK_URL: https://${DOMAIN}/
      N8N_EDITOR_BASE_URL: https://${DOMAIN}/
      N8N_PROXY_HOPS: 1
      GENERIC_TIMEZONE: Asia/Baku
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: alinino
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      NODE_FUNCTION_ALLOW_BUILTIN: "*"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
  qdrant_data:
  n8n_data:
  caddy_data:
  caddy_config:
